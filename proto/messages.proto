syntax = "proto3";

package chat.v1;

service sendMessage {
  rpc send(SendMessageRequest) returns (MessageResponse);
}

service getMessages {
  rpc get(GetMessagesRequest) returns (MessageList);
}

message SendMessageRequest {
  int32 chatId = 1;
  int32 authorId = 2;
  string text = 3;
}

message MessageResponse {
  int32 id = 1;
  int32 chatId = 2;
  int32 authorId = 3;
  string text = 4;
  string createdAt = 5;
}

message GetMessagesRequest {
  int32 chatId = 1;
  int32 userId = 2;
}

message MessageList {
  repeated MessageResponse messages = 1;
}
