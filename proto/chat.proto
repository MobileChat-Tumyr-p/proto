syntax = "proto3";

package chat.v1;

import "google/protobuf/empty.proto";

service getChatListService {
  rpc get_chat(google.protobuf.Empty) returns (AllChat);
}
service GetConcreteChatService {
  rpc get_concrete_chat(ChatId) returns (Chat);
}

message ChatId {
  int32 id = 1;
}

message Chat {
  int32 id = 1;
  string name_chat = 2;
  string description = 3;
  int32 members = 4;
}
message AllChat {
  repeated Chat list = 1;
}
