syntax = "proto3";

package chat.v1;

message Empty {}

service getChatListService {
  rpc get_chat(GetChatListRequest) returns (AllChat);
}
service GetConcreteChatService {
  rpc get_concrete_chat(ChatId) returns (Chat);
}
service getChatMembersService {
  rpc get_chat_members(GetChatMembersRequest) returns (ChatMembers);
}

message GetChatListRequest {
  int32 userId = 1;
}
message GetChatMembersRequest {
  int32 chatId = 1;
  int32 userId = 2;
}
message ChatMemberItem {
  int32 userId = 1;
  string role = 2;
}
message ChatMembers {
  repeated ChatMemberItem members = 1;
}

message ChatId {
  int32 id = 1;
}

message Chat {
  int32 id = 1;
  string title = 2;
  string lastMessage = 3;
  string updatedAt = 4;
  int32 unreadCount = 5;
  int32 members = 6;
}
message AllChat {
  repeated Chat list = 1;
}
